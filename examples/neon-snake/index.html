<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Neon Snake</title>
    <link rel="stylesheet" href="styles/game.css" />
  </head>
  <body data-game="snake">
    <main>
      <header>
        <div>
          <small>Hugame · pocket classics</small>
          <h1>Neon Snake</h1>
        </div>
        <button id="start">New game</button>
      </header>
      <section class="play-area">
        <div class="board">
          <canvas width="480" height="480" tabindex="0" aria-label="Neon Snake game board"></canvas>
        </div>
        <aside class="game-panel">
          <div class="bar"><span>Snacks</span><strong id="score">0</strong></div>
          <div class="controls">
            <button data-dir="0,-1" aria-label="Up">↑</button
            ><button data-dir="-1,0" aria-label="Left">←</button
            ><button data-dir="0,1" aria-label="Down">↓</button
            ><button data-dir="1,0" aria-label="Right">→</button>
          </div>
          <p id="status" role="status"></p>
          <p class="help">
            Use arrows, WASD, swipe, or the buttons. Eat snacks and avoid your tail.
          </p>
        </aside>
      </section>
    </main>
    <script type="module" src="scripts/game.js"></script>
  </body>
</html>
