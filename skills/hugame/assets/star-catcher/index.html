<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Star Catcher</title>
    <link rel="stylesheet" href="styles/game.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Star Catcher</h1>
        <p>A little game with a sky full of possibilities.</p>
      </header>
      <div class="board">
        <canvas
          id="game"
          width="640"
          height="360"
          tabindex="0"
          aria-label="Star Catcher play area. Arrow keys move the ring; Space catches a nearby star."
        ></canvas>
      </div>
      <div class="controls">
        <button id="start" type="button">Start game</button>
        <p id="status" role="status">Catch stars for 30 seconds. How many can you find?</p>
      </div>
      <p class="hint">Tap or click a star. Keyboard: arrow keys + Space.</p>
      <p id="save-status" class="hint" aria-live="polite"></p>
    </main>
    <script src="scripts/game.js"></script>
  </body>
</html>
